version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: rpg_prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: rpg_grafana
    ports:
      - '3001:3000'
    restart: always